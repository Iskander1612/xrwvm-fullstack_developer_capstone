services:
  mongo:
    image: mongo:8
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --eval, "db.adminCommand('ping')"]
      interval: 5s
      retries: 12
  database:
    build: ./server/database
    environment:
      MONGODB_URI: mongodb://mongo:27017/dealershipsDB
    depends_on:
      mongo:
        condition: service_healthy
  sentiment:
    build: ./server/djangoapp/microservices
  web:
    build: ./server
    ports: ["8000:8000"]
    environment:
      BACKEND_URL: http://database:3030
      SENTIMENT_URL: http://sentiment:5050
      DJANGO_DEBUG: "0"
      DATABASE_PATH: /app/data/db.sqlite3
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a random DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
    volumes: [django-data:/app/data]
    depends_on: [database, sentiment]
volumes:
  mongo-data:
  django-data:
